# Hotel Configuration
hotel.name=Grande Hotel Premium
room.status.change.enabled=true
room.history.size=5
hotel.default.rooms=20
hotel.default.services=10
csv.delimiter=;
export.enabled=true
backup.path=./backups/
supported.room.types=Standard,Luxe,President,Business,Family
max.guests.per.room=6
room.min.price=1500.0
room.max.price=100000.0
default.checkin.time=14:00
default.checkout.time=12:00

# UI Configuration
ui.refresh.rate=500
ui.date.format=dd.MM.yyyy
ui.show.warnings=true
ui.auto.save=true
ui.auto.save.interval=300
ui.max.input.attempts=5

# Guest Configuration
guest.default.name=No name mentioned
guest.passport.format=XXXXXXXXXX
guest.phone.format=+7-XXX-XXX-XXXX
guest.email=guest@example.com
guest.birth.date=2000-01-01
guest.nationality=Россия
guest.auto.generate.id=true
guest.max.name.length=100
guest.passport.regex=\\d{10}
guest.phone.regex=^\\+?[\\d\\s\\-\\(\\)]+$
guest.email.regex=^[A-Za-z0-9+_.-]+@(.+)$
guest.min.age=18
guest.max.age=120
guest.default.nationality=Russia
guest.validation.enabled=true
guest.require.email=false
guest.require.birth.date=false

# Room Configuration
room.default.id=0
room.default.price=2500.0
room.default.status=AVAILABLE
room.default.capacity=2
room.default.stars=3
room.auto.generate.id=true
room.default.type=Standard
room.max.additional.services=15
room.validation.enabled=true
room.max.history.size=100
room.min.number=1
room.max.number=9999
room.auto.clean.services.on.checkout=true

# Service Configuration
service.default.id=0
service.default.name=new service
service.default.price=0.0
service.default.description=Description of service
service.auto.generate.id=true
service.max.name.length=100
service.max.description.length=500
service.min.price=0.0
service.max.price=50000.0
service.default.category=default
service.available.categories=default,food,Spa,Vehicles,Entertains
service.validation.enabled=true

# CSV Configuration
csv.encoding=UTF-8
csv.include.headers=true
csv.date.format=yyyy-MM-dd
csv.max.line.length=10000
csv.auto.trim=true

# History Configuration
history.max.duration.days=365
history.min.duration.days=1
history.validation.enabled=true
history.default.notes=
history.default.rating=5